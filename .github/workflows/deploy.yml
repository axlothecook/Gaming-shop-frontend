# Build the frontend Docker image and publish it to GHCR.
# Runs on every push to main. (The deploy-to-Pi step is added after Stage 5 —
# Cloudflare Tunnel — once the Pi is reachable from the internet.)
name: Build and publish frontend image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/axlothecook/gaming-shop-frontend:latest
          build-args: |
            LINK=http://backend:3000
